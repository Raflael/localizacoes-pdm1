name: localizacoes
description: "Coleta e visualização de localizações — Atividade 1 de Programação para Dispositivos Móveis I."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Mapa interativo (camada de ruas do OpenStreetMap, marcadores e cache das imagens)
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  # GPS, permissão de localização e stream de posições (com serviço em primeiro plano)
  geolocator: ^14.1.2
  # Permissão de notificação no Android 13+ (para a notificação da coleta aparecer)
  permission_handler: ^12.0.1
  # Banco SQLite local
  sqflite: ^2.4.5
  path: ^1.9.1
  # Pasta privada do app para o cache do mapa
  path_provider: ^2.1.6
  # Formatação de data e hora
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: PlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
